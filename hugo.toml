baseURL = "https://tuahhamid.github.io/"
title = 'Buruh Hybrid | Tuah Hamid'
theme = 'buruh-hybrid'
languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = true
markup.goldmark.renderer.unsafe = true
markup.goldmark.parser.wrapStandAloneImageWithinParagraph = false
markup.highlight.noClasses = false

[pagination]
pagerSize = 6

# static/ is also mounted into assets so Hugo can read and resize its images.
# Their public URLs do not change.
[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "static"
  target = "assets/site-static"

[params]
  author = "Tuah Hamid"
  handle = "@buruh.hybrid"
  description = "Tuah Hamid is a Digital Engineer from Malaysia."
  keywords = "tuah, tuahhamid, buruh, buruhhybrid, website"
  since = 2019

  # PLACEHOLDER wording: post footer line.
  threadsLine = "Talk about it on Threads, @buruh.hybrid"
  # PLACEHOLDER wording: 404 page title.
  notFoundTitle = "Page not found"

  # About page links, in display order. Names match params.social.
  glanceLinks = ["Threads", "GitHub", "LinkedIn", "Email"]

# About page "at a glance" panel
[[params.glance]]
  label = "Based"
  value = "Malaysia"

[[params.glance]]
  label = "Works with"
  value = "Revit · Dynamo · pyRevit · Python · Power BI"

[[params.glance]]
  label = "Learning"
  value = "C# · .NET · Azure · BIM 2.0 tools"

[[params.glance]]
  label = "Teaches"
  value = "Scratch · micro:bit robotics"

# Footer and About links
[[params.social]]
  name = "GitHub"
  weight = 1
  url = "https://github.com/tuahhamid"

[[params.social]]
  name = "Threads"
  weight = 2
  url = "https://www.threads.com/@buruh.hybrid"

[[params.social]]
  name = "LinkedIn"
  weight = 3
  url = "https://www.linkedin.com/in/tuahhamid/"

[[params.social]]
  name = "Email"
  weight = 4
  url = "mailto:tuah.edu@gmail.com"

# Menu links
[[menu.main]]
  name = "Posts"
  weight = 3
  url = "/posts/"

[[menu.main]]
  name = "Projects"
  weight = 2
  url = "/projects/"

[[menu.main]]
  name = "About"
  weight = 1
  url = "/about/"
